<style>
:root{
  --bg:#0a0f1e;--bg2:#111827;--bg3:#1a2235;--border:#1e2d45;
  --accent:#00d4ff;--acc2:#0099bb;--green:#00e599;--amber:#f59e0b;
  --red:#ef4444;--purple:#a78bfa;--text:#e2eaf8;--muted:#5a7090;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.03)1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03)1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}

/* LANDING */
#landing{position:fixed;inset:0;overflow-y:auto;background:#04080f;z-index:90;display:none}
.lp-nav{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;position:sticky;top:0;background:rgba(4,8,15,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,212,255,.1)}
.lp-logo{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;color:var(--accent)}
.lp-logo span{color:var(--text)}
.btn-lp{background:var(--accent);color:#04080f;border:none;padding:9px 22px;border-radius:100px;font-weight:700;font-size:.85rem;cursor:pointer;font-family:'Inter',sans-serif}
.lp-hero{text-align:center;padding:60px 24px 40px;max-width:700px;margin:0 auto}
.lp-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);color:var(--accent);padding:5px 14px;border-radius:100px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:24px;font-family:'DM Mono',monospace}
.lp-h1{font-family:'Syne',sans-serif;font-size:clamp(2rem,5vw,3.5rem);font-weight:800;line-height:1.15;margin-bottom:16px;letter-spacing:-.02em}
.lp-h1 em{font-style:normal;color:var(--accent)}
.lp-sub{font-size:clamp(.9rem,2vw,1.1rem);color:#8aa0c0;max-width:480px;margin:0 auto 36px;line-height:1.7}
.btn-cta{background:var(--accent);color:#04080f;border:none;padding:15px 36px;border-radius:100px;font-weight:700;font-size:1rem;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 0 40px rgba(0,212,255,.25);margin-bottom:10px}
.lp-free{font-size:.8rem;color:var(--green)}
.lp-screen{max-width:320px;margin:36px auto 0;border-radius:22px;border:1px solid rgba(0,212,255,.15);overflow:hidden;box-shadow:0 0 60px rgba(0,212,255,.08)}
.lp-screen img{width:100%;display:block}
.lp-sec{padding:56px 24px;max-width:860px;margin:0 auto}
.lp-label{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.lp-title{font-family:'Syne',sans-serif;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;margin-bottom:36px;line-height:1.2}
.lp-steps{display:flex;flex-direction:column;gap:14px}
.lp-step{display:flex;gap:18px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:18px 20px}
.lp-step-n{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:rgba(0,212,255,.25);flex-shrink:0;width:32px;line-height:1}
.lp-step-t{font-weight:600;font-size:.9rem;margin-bottom:3px}
.lp-step-d{font-size:.82rem;color:#6a8aaa;line-height:1.5}
.lp-benefits{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.lp-ben{background:rgba(0,212,255,.03);border:1px solid rgba(0,212,255,.08);border-radius:14px;padding:18px}
.lp-ben-ico{font-size:1.4rem;margin-bottom:8px}
.lp-ben-t{font-weight:600;font-size:.88rem;margin-bottom:3px}
.lp-ben-d{font-size:.8rem;color:#6a8aaa;line-height:1.5}
.lp-test{background:rgba(0,229,153,.04);border:1px solid rgba(0,229,153,.15);border-radius:18px;padding:28px;text-align:center;max-width:520px;margin:0 auto}
.lp-quote{font-family:'Syne',sans-serif;font-size:1rem;font-style:italic;line-height:1.7;color:#c8e0d8;margin-bottom:12px}
.lp-author{font-size:.8rem;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
