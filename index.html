<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0f1e">
<title>ConsultaIA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
<style>
:root{--bg:#0a0f1e;--bg2:#111827;--bg3:#1a2235;--border:#1e2d45;--accent:#00d4ff;--acc2:#0099bb;--green:#00e599;--amber:#f59e0b;--red:#ef4444;--text:#e2eaf8;--muted:#5a7090}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.03)1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03)1px,transparent 1px);background-size:40px 40px;pointer-events:none}

/* LOGIN */
#loginScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:24px;background:var(--bg)}
.login-logo{font-family:'Syne',sans-serif;font-size:2.8rem;font-weight:800;color:var(--accent);margin-bottom:4px}
.login-logo span{color:var(--text)}
.login-sub{font-size:.88rem;color:var(--muted);margin-bottom:48px;text-align:center;line-height:1.6}
.btn-google{display:flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:14px 28px;border-radius:12px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.btn-google:hover{border-color:var(--accent);box-shadow:0 0 20px rgba(0,212,255,.15)}

/* APP */
#app{display:none;min-height:100vh;position:relative;z-index:1}
#app.on{display:block}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);background:rgba(10,15,30,.95);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50}
.logo{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;color:var(--accent)}
.logo span{color:var(--text)}
.hdr-right{display:flex;align-items:center;gap:8px}
#uPhoto{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:none}
.bsm{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:.78rem;font-family:'Inter',sans-serif;transition:all .2s}
.bsm:hover{border-color:var(--accent);color:var(--text)}
.bsm.hi{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.bsm.hi:hover{background:var(--acc2)}

/* TABS */
.tabs{display:none;background:var(--bg2);border-bottom:1px solid var(--border)}
.tab{flex:1;padding:12px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:.85rem;font-weight:600;font-family:'Inter',sans-serif;transition:all .2s;border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* VIEWS */
.view{display:none;min-height:calc(100vh - 65px);padding:28px 20px}
.view.on{display:flex;flex-direction:column;align-items:center;gap:20px}

/* RECORD BUTTON */
.timer{font-family:'DM Mono',monospace;font-size:3rem;font-weight:500;color:var(--accent);letter-spacing:.05em}
.timer.rec{color:var(--red)}
.rw{position:relative}
.rring{position:absolute;inset:-14px;border-radius:50%;border:2px solid var(--red);opacity:0;transform:scale(.9);pointer-events:none}
.rring.on{animation:pulse 1.5s ease-out infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.4)}}
.brec{width:110px;height:110px;border-radius:50%;border:2px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all .2s;position:relative;z-index:1;-webkit-tap-highlight-color:transparent}
.brec .ico{font-size:2rem;pointer-events:none}
.brec .lbl{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;pointer-events:none}
.brec.rec{border-color:var(--red);background:rgba(239,68,68,.1);box-shadow:0 0 30px rgba(239,68,68,.2)}
.brec:active{transform:scale(.95)}

/* STATUS */
.chip{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);padding:9px 18px;border-radius:100px;font-size:.8rem;color:var(--muted);min-width:250px;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
.dot.rec{background:var(--red);animation:blink 1s infinite}
.dot.proc{background:var(--amber);animation:blink .5s infinite}
.dot.ok{background:var(--green)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* STEPS */
.steps{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;width:100%;max-width:360px}
.steps-title{font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.step{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:none}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;font-family:'DM Mono',monospace;color:var(--muted);flex-shrink:0}
.step-txt{font-size:.83rem;color:#a0b8d0;line-height:1.4}

/* UPLOAD */
.upload-zone{width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px}
.ulbl{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:14px;cursor:pointer;background:var(--bg3);border:2px dashed var(--border);color:var(--muted);font-size:.88rem;font-weight:600;font-family:'Inter',sans-serif;transition:all .2s;-webkit-tap-highlight-color:transparent}
.ulbl:hover,.ulbl:active{border-color:var(--accent);color:var(--text)}
.uhint{font-size:.73rem;color:var(--muted);text-align:center;line-height:1.6}

/* PROCESSING */
#procOverlay{display:none;position:fixed;inset:0;background:rgba(10,15,30,.92);z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#procOverlay.on{display:flex}
.spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.proc-msg{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;color:var(--text);text-align:center}
.proc-sub{font-size:.83rem;color:var(--muted);text-align:center}

/* RESULTADO MOBILE */
#mResult{width:100%;max-width:460px}
.rcard{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px}
.rtitle{font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.rbody{font-size:.85rem;line-height:1.85;color:#c8d8f0;white-space:pre-wrap}
.rbody.mono{font-family:'DM Mono',monospace;font-size:.8rem;color:#a8c8e8}
.bcopy{width:100%;margin-top:12px;padding:12px;background:var(--accent);color:var(--bg);border:none;border-radius:10px;font-weight:700;font-size:.88rem;cursor:pointer;font-family:'Inter',sans-serif}
.bcopy.all{background:var(--green);margin-bottom:40px}
.bcopy:active{opacity:.85}

/* DESKTOP */
.deskwrap{width:100%;max-width:860px;margin:0 auto}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;gap:12px;color:var(--muted);text-align:center}
.empty .ico{font-size:2.5rem}
.empty h2{font-family:'Syne',sans-serif;font-size:1.1rem;color:var(--text)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:14px}
.chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.ctitle{font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.nbadge{background:rgba(0,229,153,.12);border:1px solid rgba(0,229,153,.3);color:var(--green);font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:100px;font-family:'DM Mono',monospace;display:none}
.etext{font-size:.9rem;line-height:1.9;color:#c8d8f0;white-space:pre-wrap}
.ciditem{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.83rem;font-family:'DM Mono',monospace;color:#a8c8e8;margin-bottom:6px}
.brow{display:flex;gap:8px;flex-wrap:wrap}
.bp{background:var(--accent);color:var(--bg);border:none;padding:8px 18px;border-radius:8px;font-weight:700;font-size:.83rem;cursor:pointer;font-family:'Inter',sans-serif}
.bp:hover{background:var(--acc2)}
.bs{background:transparent;color:var(--muted);border:1px solid var(--border);padding:8px 18px;border-radius:8px;font-size:.83rem;cursor:pointer;font-family:'Inter',sans-serif}
.bs:hover{border-color:var(--accent);color:var(--text)}
.hi-item{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:8px;cursor:pointer;transition:all .2s;position:relative}
.hi-item:hover{border-color:var(--accent)}
.hi-time{font-family:'DM Mono',monospace;font-size:.73rem;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hi-pre{font-size:.85rem;color:#7a9ab8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.hi-exp{font-size:.68rem;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap;flex-shrink:0}
.hi-exp.soon{color:var(--amber)}
.bdel{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:.95rem;padding:2px 6px;border-radius:6px;transition:all .2s;flex-shrink:0;line-height:1}
.bdel:hover{color:var(--red);background:rgba(239,68,68,.1)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:11px 22px;border-radius:100px;font-size:.83rem;font-weight:500;transition:transform .3s;z-index:999;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="errBox" style="display:none;position:fixed;inset:0;background:#1a0000;color:#ff6666;padding:20px;z-index:9999;font-family:monospace;font-size:13px;overflow:auto;white-space:pre-wrap"></div>
<script>
window.onerror = function(msg, src, line, col, err) {
  var b = document.getElementById('errBox');
  b.style.display = 'block';
  b.textContent = 'ERRO JS:\n' + msg + '\nLinha: ' + line + '\n' + (err ? err.stack : '');
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var b = document.getElementById('errBox');
  b.style.display = 'block';
  b.textContent += '\nPROMISE REJEITADA:\n' + (e.reason ? e.reason.stack || e.reason : e);
});
</script>

<!-- LANDING PAGE -->
<div id="landingPage" style="display:none;position:fixed;inset:0;overflow-y:auto;background:#04080f;z-index:90">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap');

    #landingPage {
      font-family: 'DM Sans', sans-serif;
      color: #e8f0ff;
    }

    .lp-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 32px;
      position: sticky;
      top: 0;
      background: rgba(4,8,15,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,212,255,0.1);
      z-index: 10;
    }

    .lp-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 900;
      color: #00d4ff;
      letter-spacing: -0.02em;
    }

    .lp-logo span { color: #e8f0ff; }

    .lp-nav-btn {
      background: #00d4ff;
      color: #04080f;
      border: none;
      padding: 10px 22px;
      border-radius: 100px;
      font-weight: 700;
      font-size: .88rem;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all .2s;
    }

    .lp-nav-btn:hover { background: #00b8d9; transform: translateY(-1px); }

    .lp-hero {
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px 40px;
      position: relative;
      overflow: hidden;
    }

    .lp-hero::before {
      content: '';
      position: absolute;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,212,255,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .lp-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,212,255,0.08);
      border: 1px solid rgba(0,212,255,0.2);
      color: #00d4ff;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 28px;
      font-family: 'DM Mono', monospace;
    }

    .lp-h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
      max-width: 700px;
    }

    .lp-h1 em {
      font-style: normal;
      color: #00d4ff;
    }

    .lp-sub {
      font-size: clamp(.95rem, 2vw, 1.15rem);
      color: #8aa0c0;
      max-width: 520px;
      line-height: 1.7;
      margin-bottom: 40px;
      font-weight: 300;
    }

    .lp-cta-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .lp-cta-main {
      background: #00d4ff;
      color: #04080f;
      border: none;
      padding: 16px 36px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all .25s;
      box-shadow: 0 0 40px rgba(0,212,255,0.25);
    }

    .lp-cta-main:hover {
      background: #00b8d9;
      transform: translateY(-2px);
      box-shadow: 0 0 60px rgba(0,212,255,0.35);
    }

    .lp-free {
      font-size: .82rem;
      color: #00e599;
      font-weight: 500;
    }

    .lp-screen {
      width: 100%;
      max-width: 340px;
      border-radius: 24px;
      border: 1px solid rgba(0,212,255,0.15);
      box-shadow: 0 0 60px rgba(0,212,255,0.08);
      margin: 40px auto 0;
      overflow: hidden;
    }

    .lp-screen img {
      width: 100%;
      display: block;
    }

    /* COMO FUNCIONA */
    .lp-section {
      padding: 64px 24px;
      max-width: 860px;
      margin: 0 auto;
    }

    .lp-section-label {
      font-family: 'DM Mono', monospace;
      font-size: .72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #00d4ff;
      margin-bottom: 12px;
    }

    .lp-section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 40px;
    }

    .lp-steps {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .lp-step {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 20px 24px;
      transition: border-color .2s;
    }

    .lp-step:hover { border-color: rgba(0,212,255,0.2); }

    .lp-step-num {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 900;
      color: rgba(0,212,255,0.3);
      line-height: 1;
      flex-shrink: 0;
      width: 36px;
    }

    .lp-step-title {
      font-weight: 600;
      font-size: .95rem;
      margin-bottom: 4px;
      color: #e8f0ff;
    }

    .lp-step-desc {
      font-size: .85rem;
      color: #6a8aaa;
      line-height: 1.6;
    }

    /* BENEFÍCIOS */
    .lp-benefits {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .lp-benefit {
      background: rgba(0,212,255,0.03);
      border: 1px solid rgba(0,212,255,0.08);
      border-radius: 16px;
      padding: 20px;
    }

    .lp-benefit-icon { font-size: 1.5rem; margin-bottom: 10px; }

    .lp-benefit-title {
      font-weight: 600;
      font-size: .9rem;
      margin-bottom: 4px;
    }

    .lp-benefit-desc {
      font-size: .82rem;
      color: #6a8aaa;
      line-height: 1.6;
    }

    /* DEPOIMENTO */
    .lp-testimonial {
      background: rgba(0,229,153,0.04);
      border: 1px solid rgba(0,229,153,0.15);
      border-radius: 20px;
      padding: 32px;
      text-align: center;
      max-width: 560px;
      margin: 0 auto;
    }

    .lp-quote {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-style: italic;
      line-height: 1.7;
      color: #c8e0d8;
      margin-bottom: 16px;
    }

    .lp-author {
      font-size: .82rem;
      color: #00e599;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* PREÇO */
    .lp-price-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(0,212,255,0.15);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      max-width: 380px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    .lp-price-card::before {
      content: '';
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 200px;
      background: radial-gradient(circle, rgba(0,212,255,0.06) 0%, transparent 70%);
    }

    .lp-trial-badge {
      background: #00e599;
      color: #04080f;
      font-size: .75rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 100px;
      display: inline-block;
      margin-bottom: 20px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .lp-price {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 900;
      color: #00d4ff;
      line-height: 1;
      margin-bottom: 4px;
    }

    .lp-price sup {
      font-size: 1.4rem;
      vertical-align: super;
    }

    .lp-price-period {
      font-size: .85rem;
      color: #6a8aaa;
      margin-bottom: 8px;
    }

    .lp-price-note {
      font-size: .78rem;
      color: #8aa0c0;
      margin-bottom: 28px;
    }

    .lp-price-features {
      list-style: none;
      text-align: left;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .lp-price-features li {
      font-size: .88rem;
      color: #8aa0c0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lp-price-features li::before {
      content: '✓';
      color: #00e599;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* FOOTER */
    .lp-footer {
      text-align: center;
      padding: 32px 24px;
      border-top: 1px solid rgba(255,255,255,0.05);
